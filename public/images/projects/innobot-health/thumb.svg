<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Innobot Health design system">
  <defs>
    <radialGradient id="ibGlowA" cx="20%" cy="12%" r="62%">
      <stop offset="0%" stop-color="#2fd3c8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2fd3c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ibGlowB" cx="86%" cy="88%" r="58%">
      <stop offset="0%" stop-color="#2fd3c8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2fd3c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ibCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Ground. Never pure black. -->
  <rect width="1200" height="900" fill="#050708"/>
  <rect width="1200" height="900" fill="url(#ibGlowA)"/>
  <rect width="1200" height="900" fill="url(#ibGlowB)"/>

  <!-- Structural rules -->
  <g stroke="#1a2429" stroke-width="1">
    <line x1="0" y1="188" x2="1200" y2="188"/>
    <line x1="0" y1="646" x2="1200" y2="646"/>
  </g>

  <!-- Mono label -->
  <text x="88" y="118" font-family="ui-monospace, 'IBM Plex Mono', Menlo, monospace"
        font-size="26" letter-spacing="6" fill="#2fd3c8">INNOBOT HEALTH</text>
  <text x="88" y="156" font-family="ui-monospace, 'IBM Plex Mono', Menlo, monospace"
        font-size="22" letter-spacing="5" fill="#6a8a8d">DESIGN SYSTEM</text>

  <!-- Glass card, the site's signature surface -->
  <g>
    <rect x="88" y="256" width="472" height="318" rx="2" fill="url(#ibCard)"/>
    <rect x="88" y="256" width="472" height="318" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
    <line x1="89" y1="257" x2="559" y2="257" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="128" y="318" font-family="ui-monospace, 'IBM Plex Mono', Menlo, monospace"
          font-size="20" letter-spacing="4" fill="#6a8a8d">CLEAN CLAIMS</text>
    <text x="128" y="416" font-family="system-ui, 'Syne', sans-serif"
          font-size="94" font-weight="700" fill="#2fd3c8">98.2%</text>
    <text x="128" y="470" font-family="system-ui, 'Syne', sans-serif"
          font-size="24" fill="#9ab5b8">Teal means value delivered.</text>
    <text x="128" y="524" font-family="ui-monospace, 'IBM Plex Mono', Menlo, monospace"
          font-size="16" letter-spacing="3" fill="#354548">ILLUSTRATIVE</text>
  </g>

  <!-- Display voice -->
  <text x="624" y="330" font-family="Georgia, 'Fraunces', serif" font-size="62"
        fill="#f0fafa">Revenue cycle,</text>
  <text x="624" y="404" font-family="Georgia, 'Fraunces', serif" font-size="62"
        font-style="italic" fill="#2fd3c8">automated.</text>

  <!-- Type ramp -->
  <text x="624" y="486" font-family="system-ui, 'Syne', sans-serif" font-size="30"
        font-weight="600" fill="#9ab5b8">Syne · interface</text>
  <text x="624" y="534" font-family="ui-monospace, 'IBM Plex Mono', Menlo, monospace"
        font-size="22" letter-spacing="4" fill="#6a8a8d">PLEX MONO · 00.00</text>

  <!-- Palette. Structure, then state. -->
  <g>
    <rect x="88" y="714" width="160" height="92" fill="#050708" stroke="#2a3a42"/>
    <rect x="272" y="714" width="160" height="92" fill="#0d1115" stroke="#2a3a42"/>
    <rect x="456" y="714" width="160" height="92" fill="#1a2429" stroke="#2a3a42"/>
    <rect x="640" y="714" width="160" height="92" fill="#2fd3c8"/>
    <rect x="824" y="714" width="160" height="92" fill="#f59e0b"/>
    <rect x="1008" y="714" width="104" height="92" fill="#e85d69"/>
  </g>
  <text x="88" y="848" font-family="ui-monospace, 'IBM Plex Mono', Menlo, monospace"
        font-size="18" letter-spacing="4" fill="#354548">GROUND · SURFACE · BORDER · VALUE · HUMAN · BLOCKED</text>
</svg>
